services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped      
    environment:
      POSTGRES_USER: sicom
      POSTGRES_PASSWORD: sicom
      POSTGRES_DB: sicom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicom -d sicom_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: